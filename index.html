<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#050814" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Job Ready By Nov 30, 2026 | Java Developer</title>
  <link rel="manifest" href="manifest.json" />
  <style>
    :root {
      --bg-dark: #050814;
      --bg-navy: #0a1128;
      --cyan: #00f0ff;
      --royal: #2563eb;
      --violet: #7c3aed;
      --glass-bg: rgba(15, 23, 42, 0.55);
      --glass-border: rgba(0, 240, 255, 0.28);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      background: radial-gradient(circle at 20% 15%, rgba(37, 99, 235, 0.25), transparent 45%),
                  radial-gradient(circle at 85% 80%, rgba(124, 58, 237, 0.22), transparent 50%),
                  linear-gradient(160deg, var(--bg-dark) 0%, var(--bg-navy) 55%, #03050c 100%);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 1.5rem 1.25rem;
      overflow-x: hidden;
      position: relative;
    }

    /* Subtle Circuit Grid Background */
    .circuit-bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.14;
      background-image: 
        linear-gradient(to right, rgba(0, 240, 255, 0.2) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(0, 240, 255, 0.2) 1px, transparent 1px);
      background-size: 40px 40px;
      mask-image: radial-gradient(circle at center, black 40%, transparent 85%);
      -webkit-mask-image: radial-gradient(circle at center, black 40%, transparent 85%);
      z-index: 0;
    }

    .floating-code {
      position: fixed;
      font-family: "Courier New", Courier, monospace;
      color: rgba(0, 240, 255, 0.18);
      font-weight: bold;
      user-select: none;
      pointer-events: none;
      z-index: 0;
    }

    .code-1 { top: 8%; left: 7%; font-size: 1.1rem; }
    .code-2 { top: 14%; right: 8%; font-size: 1.25rem; }
    .code-3 { bottom: 22%; left: 6%; font-size: 1rem; }
    .code-4 { bottom: 16%; right: 8%; font-size: 1.15rem; }

    .container {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      z-index: 1;
      gap: 1.25rem;
      margin: auto 0;
    }

    /* Header Section */
    .header-group {
      margin-top: 0.5rem;
    }

    .sub-heading {
      font-size: 0.9rem;
      letter-spacing: 0.28em;
      color: var(--text-muted);
      font-weight: 600;
      margin-bottom: 0.35rem;
    }

    .main-goal {
      font-size: clamp(1.75rem, 7vw, 2.35rem);
      font-weight: 800;
      letter-spacing: 0.06em;
      background: linear-gradient(90deg, #38bdf8, var(--cyan), #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 28px rgba(0, 240, 255, 0.25);
      margin-bottom: 0.35rem;
    }

    .deadline-badge {
      display: inline-block;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      color: #e2e8f0;
      padding: 0.35rem 0.9rem;
      border-radius: 999px;
      background: rgba(37, 99, 235, 0.2);
      border: 1px solid rgba(56, 189, 248, 0.35);
    }

    /* Countdown Grid */
    .countdown-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.6rem;
      width: 100%;
      margin: 0.4rem 0;
    }

    .time-card {
      background: var(--glass-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 0.95rem 0.35rem;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45), inset 0 0 12px rgba(0, 240, 255, 0.08);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .time-card::after {
      content: "";
      position: absolute;
      top: 0;
      left: 15%;
      right: 15%;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--cyan), transparent);
    }

    .time-value {
      font-size: clamp(1.65rem, 6.5vw, 2.2rem);
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      color: #ffffff;
      text-shadow: 0 0 16px rgba(0, 240, 255, 0.55);
      line-height: 1.1;
      transition: transform 0.18s ease, color 0.18s ease;
    }

    .time-value.pulse {
      transform: scale(1.06);
      color: var(--cyan);
    }

    .time-label {
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      color: var(--cyan);
      margin-top: 0.4rem;
    }

    /* Progress Bar Section */
    .progress-section {
      width: 100%;
      background: rgba(15, 23, 42, 0.5);
      border: 1px solid rgba(148, 163, 184, 0.18);
      border-radius: 14px;
      padding: 0.85rem 1rem;
    }

    .progress-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 0.45rem;
      letter-spacing: 0.05em;
    }

    .progress-percent {
      color: var(--cyan);
      font-weight: 700;
    }

    .progress-track {
      width: 100%;
      height: 8px;
      background: rgba(30, 41, 59, 0.9);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--royal), var(--cyan), var(--violet));
      border-radius: 999px;
      box-shadow: 0 0 12px rgba(0, 240, 255, 0.6);
      transition: width 0.5s ease;
    }

    /* Java Coffee Cup SVG Graphic */
    .java-graphic {
      width: 68px;
      height: 68px;
      filter: drop-shadow(0 0 14px rgba(0, 240, 255, 0.45));
      margin: 0.15rem 0;
    }

    .steam {
      animation: floatSteam 3s ease-in-out infinite;
      transform-origin: center;
    }
    .steam-2 { animation-delay: 1s; }

    @keyframes floatSteam {
      0%, 100% { transform: translateY(0); opacity: 0.7; }
      50% { transform: translateY(-4px); opacity: 1; }
    }

    /* Motivational Section */
    .motivation-box {
      padding: 0.25rem 0.5rem;
    }

    .motivation-heading {
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.26em;
      color: var(--cyan);
      margin-bottom: 0.55rem;
    }

    .motivation-lines {
      font-size: 1.15rem;
      font-weight: 600;
      line-height: 1.5;
      color: #f1f5f9;
    }

    /* Live IST Clock Footer */
    .ist-clock-box {
      width: 100%;
      padding: 0.65rem 0.9rem;
      border-radius: 12px;
      background: rgba(10, 17, 40, 0.75);
      border: 1px solid rgba(124, 58, 237, 0.3);
      font-size: 0.78rem;
      color: #cbd5e1;
      letter-spacing: 0.04em;
    }

    .ist-label {
      color: #a78bfa;
      font-weight: 700;
      display: block;
      font-size: 0.68rem;
      letter-spacing: 0.12em;
      margin-bottom: 0.15rem;
    }

    .status-banner {
      display: none;
      width: 100%;
      padding: 0.85rem;
      border-radius: 12px;
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.25), rgba(6, 182, 212, 0.25));
      border: 1px solid #10b981;
      color: #a7f3d0;
      font-weight: 700;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <div class="circuit-bg"></div>
  <div class="floating-code code-1">&lt;Java /&gt;</div>
  <div class="floating-code code-2">{ }</div>
  <div class="floating-code code-3">public static void main</div>
  <div class="floating-code code-4">// 2026</div>

  <main class="container">
    <header class="header-group">
      <div class="sub-heading">JOB READY BY</div>
      <h1 class="main-goal">JAVA DEVELOPER</h1>
      <div class="deadline-badge">NOVEMBER 30, 2026</div>
    </header>

    <div id="completedBanner" class="status-banner">
      DEADLINE REACHED — YOU ARE JOB READY!
    </div>

    <section class="countdown-grid" aria-label="Live Countdown Timer">
      <div class="time-card">
        <span class="time-value" id="days">00</span>
        <span class="time-label">DAYS</span>
      </div>
      <div class="time-card">
        <span class="time-value" id="hours">00</span>
        <span class="time-label">HOURS</span>
      </div>
      <div class="time-card">
        <span class="time-value" id="minutes">00</span>
        <span class="time-label">MINUTES</span>
      </div>
      <div class="time-card">
        <span class="time-value" id="seconds">00</span>
        <span class="time-label">SECONDS</span>
      </div>
    </section>

    <section class="progress-section" aria-label="Sprint Progress">
      <div class="progress-header">
        <span>SPRINT PROGRESS</span>
        <span class="progress-percent" id="progressPercent">0.00%</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </section>

    <!-- Custom Java Inspired SVG Graphic -->
    <svg class="java-graphic" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <defs>
        <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#00f0ff" />
          <stop offset="50%" stop-color="#3b82f6" />
          <stop offset="100%" stop-color="#8b5cf6" />
        </linearGradient>
      </defs>
      <!-- Steam lines -->
      <path class="steam" d="M42 36 C37 28, 48 22, 43 13" stroke="url(#neonGrad)" stroke-width="3" stroke-linecap="round" />
      <path class="steam steam-2" d="M55 34 C50 26, 61 20, 56 11" stroke="url(#neonGrad)" stroke-width="3" stroke-linecap="round" />
      <!-- Cup Body -->
      <path d="M26 44 H70 V58 C70 70, 58 76, 48 76 C38 76, 26 70, 26 58 Z" stroke="url(#neonGrad)" stroke-width="3.2" fill="rgba(0, 240, 255, 0.06)" />
      <!-- Handle -->
      <path d="M70 48 H76 C81 48, 84 51, 84 56 C84 61, 81 64, 76 64 H70" stroke="url(#neonGrad)" stroke-width="3.2" stroke-linecap="round" />
      <!-- Saucer Waves -->
      <path d="M20 82 Q48 88 76 82" stroke="url(#neonGrad)" stroke-width="3" stroke-linecap="round" />
      <path d="M28 89 Q48 93 68 89" stroke="url(#neonGrad)" stroke-width="2.5" stroke-linecap="round" opacity="0.75" />
    </svg>

    <section class="motivation-box">
      <div class="motivation-heading">EVERY DAY COUNTS</div>
      <div class="motivation-lines">
        Stay Focused.<br />
        Keep Building.<br />
        Never Give Up.
      </div>
    </section>

    <footer class="ist-clock-box">
      <span class="ist-label">CURRENT TIME (IST)</span>
      <span id="istClock">Loading IST time...</span>
    </footer>
  </main>

  <script>
    // Target Deadline: November 30, 2026 at 11:59:59 PM IST (UTC+05:30)
    const TARGET_ISO = "2026-11-30T23:59:59+05:30";
    // Sprint Start Reference: November 17, 2026 at 00:00:00 IST
    const START_ISO = "2026-11-17T00:00:00+05:30";

    const targetTime = new Date(TARGET_ISO).getTime();
    const startTime = new Date(START_ISO).getTime();

    const daysEl = document.getElementById("days");
    const hoursEl = document.getElementById("hours");
    const minutesEl = document.getElementById("minutes");
    const secondsEl = document.getElementById("seconds");
    const progressFillEl = document.getElementById("progressFill");
    const progressPercentEl = document.getElementById("progressPercent");
    const istClockEl = document.getElementById("istClock");
    const completedBannerEl = document.getElementById("completedBanner");

    function padZero(num) {
      return String(num).padStart(2, "0");
    }

    function updateCountdown() {
      const now = Date.now();
      const diff = targetTime - now;

      // Update live IST Date & Time display
      const istFormatter = new Intl.DateTimeFormat("en-IN", {
        timeZone: "Asia/Kolkata",
        weekday: "short",
        year: "numeric",
        month: "short",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: true
      });
      istClockEl.textContent = istFormatter.format(new Date(now)) + " IST";

      if (diff <= 0) {
        daysEl.textContent = "00";
        hoursEl.textContent = "00";
        minutesEl.textContent = "00";
        secondsEl.textContent = "00";
        progressFillEl.style.width = "100%";
        progressPercentEl.textContent = "100.00%";
        completedBannerEl.style.display = "block";
        return;
      }

      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
      const minutes = Math.floor((diff / 1000 / 60) % 60);
      const seconds = Math.floor((diff / 1000) % 60);

      daysEl.textContent = padZero(days);
      hoursEl.textContent = padZero(hours);
      minutesEl.textContent = padZero(minutes);
      secondsEl.textContent = padZero(seconds);

      // Subtle pulse animation on seconds tick
      secondsEl.classList.remove("pulse");
      void secondsEl.offsetWidth;
      secondsEl.classList.add("pulse");

      // Calculate sprint progress bar
      const totalDuration = targetTime - startTime;
      const elapsed = Math.max(0, now - startTime);
      const pct = Math.min(100, Math.max(0, (elapsed / totalDuration) * 100));
      progressFillEl.style.width = pct.toFixed(2) + "%";
      progressPercentEl.textContent = pct.toFixed(2) + "%";
    }

    // Run immediately and then every 1000ms
    updateCountdown();
    setInterval(updateCountdown, 1000);

    // Register Service Worker for Offline PWA Support
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
